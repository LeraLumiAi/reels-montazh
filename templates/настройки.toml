# Настройки монтажа по умолчанию.
# Любую из них можно поменять одной фразой перед монтажом конкретного ролика,
# например: «Смонтируй до 60 секунд». Здесь хранится то, что берётся, если ничего не сказано.
# Русские названия — обязательно в кавычках, иначе формат TOML их не прочитает.

["автор"]
# Маленькая подпись на карточках (заголовок, призыв в конце). Пусто — без подписи.
"подпись" = "Ваша подпись"

["длина"]
# Максимальная длина ролика в секундах. 0 — без ограничения (сколько останется после чистки).
# Короче 60 секунд не сокращаем. Обычные лимиты: 60, 90.
"максимум_секунд" = 0

["ускорение"]
# Насколько можно ускорить речь, если ролик длиннее лимита. 1.0 — не ускорять, 1.3 — максимум.
# Опыт: ускорение в 1,2 раза уже звучит слишком быстро — по умолчанию не ускоряем.
"предел" = 1.0

["чистка"]
# Паузы длиннее этого (в секундах) вырезаются.
"пауза_больше" = 0.35
# Насколько тихим должен быть звук, чтобы считаться паузой (в децибелах; ближе к нулю — строже).
"порог_тишины_дб" = -35
# Сколько тишины оставить на стыке, чтобы речь не звучала «рубленой» (в секундах).
"оставить_тишины" = 0.12
# Слова-паразиты, которые вырезаются.
"паразиты" = ["э", "ээ", "эээ", "эм", "мм", "ну", "как бы", "типа", "короче", "в общем", "так сказать"]
# Неудачные дубли (спикер сбился и повторил) — вырезать сразу, оставляя последний вариант.
"дубли" = "вырезать сразу"

["субтитры"]
# Слова, которые всегда пишутся с большой буквы, во всех падежах — начала слов.
# Пример: ["москв"] → Москва, Москвы, Москве.
"с_большой_буквы" = []
# Пары слов, обе с большой буквы. Третий элемент «через дефис» — склеить в одно слово.
# Пример: [["генеральн", "директор"], ["санкт", "петербург", "через дефис"]]
"пары_с_большой_буквы" = []

["тикток"]
# Карточка в конце дубля для ТикТока (там нет механики «напиши слово в комментариях»).
# *звёздочки* — курсивный акцент, \n — новая строка.
"заголовок" = "Забирайте *подарок*"
"ниже" = "по ссылке\nв шапке профиля"

["видео"]
"ширина" = 1080
"высота" = 1920
"кадров_в_секунду" = 30

["оформление"]
"стиль" = "Тёплый свет"
# Карточки: «умеренная» — примерно раз в 10 секунд, «редкая» — раз в 20 с, «плотная» — раз в 5–7 с.
"плотность_графики" = "умеренная"   # редкая / умеренная / плотная
"заголовок_в_начале" = "предлагать" # всегда / никогда / предлагать
"карточка_в_конце" = "предлагать"   # всегда / никогда / предлагать
"субтитры" = "по центру ниже лица"
"звук" = "только голос"
